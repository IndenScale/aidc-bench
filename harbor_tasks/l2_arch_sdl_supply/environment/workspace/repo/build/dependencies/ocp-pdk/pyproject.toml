[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-ocp-pdk"
version = "0.1.0"
description = "OCP (ORv3 / ACS Liquid Cooling / DCF) multi-view PDK cells for TexSys"
requires-python = ">=3.11"
dependencies = [
  "texsys",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["texsys_ocp_pdk*"]

[tool.uv.sources]
texsys = { workspace = true }
