schema_version = 1

[project]
name = "domain-rc"
version = "0.1.0"

[layout]
source = "src"
assets = "assets"
build = "build"

[package]
kind = "capability"
description = "几何、电力、传热、水力与暖通领域规则检查"
capabilities = ["rules", "geometry"]
include = ["README.md", "tests"]
tests = ["tests"]

[package.runtime]
api_version = 1
modules = ["texsys_domain_rc"]
entry_point = "texsys_domain_rc.build:package"
requires = []
