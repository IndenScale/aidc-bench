[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texsys-aidc-vendor-pdk"
version = "0.1.0"
description = "Public vendor-datasheet calibrated multi-view PDK cells for AIDC AI Factory architectures"
requires-python = ">=3.11"
dependencies = [
  "texsys",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["texsys_aidc_vendor_pdk*"]

[tool.uv.sources]
texsys = { workspace = true }
